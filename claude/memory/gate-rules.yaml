# Memory Injection Gate Rules
# 定义每个 agent 进入系统时自动注入哪些记忆域
# agent_name → [domains]
# domains: preferences | lessons | infrastructure | constraints | wechat | phone | windows

rules:
  - agent: "sisyphus"
    domains: [preferences, lessons, infrastructure, constraints]
    pre_hook: true
    post_hook: true
    
  - agent: "cc-autonomous"
    domains: [preferences, lessons, infrastructure]
    pre_hook: true
    post_hook: true

  - agent: "charlie-ego"
    domains: [preferences, lessons]
    pre_hook: true
    post_hook: false

  - agent: "service-nurse"
    domains: [infrastructure, constraints, lessons]
    pre_hook: true
    post_hook: true

  - agent: "proxy-guardian"
    domains: [infrastructure, lessons]
    pre_hook: true
    post_hook: false

  - agent: "security-watchdog"
    domains: [infrastructure, constraints]
    pre_hook: true
    post_hook: true

  - agent: "memory-curator"
    domains: [preferences, lessons]
    pre_hook: true
    post_hook: true

  - agent: "ops-dispatcher"
    domains: [preferences, lessons, infrastructure]
    pre_hook: true
    post_hook: true

  - agent: "git-backup"
    domains: [infrastructure]
    pre_hook: false
    post_hook: true

  - agent: "tech-architect"
    domains: [preferences, infrastructure, constraints]
    pre_hook: true
    post_hook: false

  - agent: "tech-researcher"
    domains: [preferences, infrastructure]
    pre_hook: true
    post_hook: false

  - agent: "agi-mentor"
    domains: [preferences, lessons, constraints]
    pre_hook: true
    post_hook: false

  # 缺省规则（所有未匹配 agent）
  - agent: "*"
    domains: [preferences, infrastructure]
    pre_hook: true
    post_hook: false