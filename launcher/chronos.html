<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chronos Dashboard</title>
<style>
:root {
  --base: #1e1e2e; --surface0: #313244; --surface1: #45475a;
  --text: #cdd6f4; --subtext: #a6adc8; --overlay0: #6c7086;
  --blue: #89b4fa; --purple: #cba6f7; --red: #f38ba8;
  --green: #a6e3a1; --yellow: #f9e2af; --peach: #fab387;
  --teal: #94e2d5; --font: 'JetBrains Mono', 'SF Mono', monospace;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: var(--font); background: var(--base); color: var(--text);
  padding: 20px; max-width: 1400px; margin: 0 auto;
  font-size: 13px; line-height: 1.6;
}

/* Breathing Light */
.breathing-bar {
  width: 100%; height: 3px; background: var(--base);
  position: relative; overflow: hidden; margin-bottom: 20px;
  border: 1px solid var(--surface0);
}
.breathing-bar .pulse {
  position: absolute; top: 0; left: -50%; width: 50%; height: 100%;
  background: linear-gradient(90deg, transparent, var(--purple), transparent);
  opacity: 0.8;
}
@keyframes breathe-delta { 0%{left:-50%} 100%{left:100%} }
@keyframes breathe-alpha { 0%{left:-50%} 100%{left:100%} }
@keyframes breathe-intense { 0%{left:-50%} 100%{left:100%} }

/* Mode Badge */
.mode-badge {
  display: inline-block; padding: 4px 16px; border: 1px solid var(--surface1);
  font-size: 12px; font-weight: 700; letter-spacing: 2px; margin-bottom: 16px;
}
.mode-delta { color: var(--blue); border-color: var(--blue); }
.mode-alpha { color: var(--purple); border-color: var(--purple); }
.mode-intense { color: var(--red); border-color: var(--red); }

/* Layout */
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: auto auto auto;
  gap: 16px;
}
.panel-left { grid-column: 1; }
.panel-right-top { grid-column: 2; grid-row: 2; }
.panel-right-bottom { grid-column: 2; grid-row: 3; }
.panel-full { grid-column: 1 / -1; }

.panel {
  border: 1px solid var(--surface0); padding: 16px; background: var(--base);
}
.panel-title {
  color: var(--overlay0); font-size: 11px; letter-spacing: 1.5px;
  text-transform: uppercase; margin-bottom: 12px;
  border-bottom: 1px solid var(--surface0); padding-bottom: 6px;
}

/* Metric bars */
.metric-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.metric-label { width: 50px; color: var(--subtext); font-size: 12px; text-align: right; }
.metric-bar {
  flex: 1; height: 6px; background: var(--surface0); position: relative; overflow: hidden;
}
.metric-fill {
  height: 100%; transition: width 0.5s ease, background 0.5s ease;
}
.metric-value { width: 50px; color: var(--subtext); font-size: 12px; }

/* Shield indicator */
.shield { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
.shield-icon { font-size: 18px; }
.shield-level { font-size: 12px; letter-spacing: 1px; }
.shield-normal { color: var(--green); }
.shield-caution { color: var(--yellow); }
.shield-warning { color: var(--peach); }
.shield-critical { color: var(--red); }

/* Activity feed */
.feed-item {
  padding: 4px 0; border-bottom: 1px solid var(--surface0);
  font-size: 12px; color: var(--subtext);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.feed-item .tag {
  display: inline-block; padding: 1px 6px; font-size: 10px;
  margin-right: 6px; border: 1px solid;
}
.tag-success { color: var(--green); border-color: var(--green); }
.tag-fix { color: var(--peach); border-color: var(--peach); }
.tag-info { color: var(--blue); border-color: var(--blue); }

/* Skill bars */
.skill-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.skill-name { width: 120px; font-size: 11px; color: var(--subtext); text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.skill-bar { flex: 1; height: 4px; background: var(--surface0); }
.skill-fill { height: 100%; background: var(--purple); transition: width 0.5s ease; }
.skill-xp { width: 40px; font-size: 10px; color: var(--overlay0); text-align: right; }

/* Dream reports */
.dream-item {
  font-size: 11px; color: var(--overlay0); padding: 2px 0;
}
.dream-item a { color: var(--teal); text-decoration: none; }
.dream-item a:hover { text-decoration: underline; }

/* AGI Pipeline */
.agi-stage {
  display: flex; flex-direction: column; align-items: center;
  padding: 8px 16px; border: 1px solid var(--surface1);
  transition: all 0.3s ease;
}
.agi-stage-active {
  border-color: var(--purple); background: var(--surface0);
}
.stage-icon { font-size: 24px; margin-bottom: 4px; }
.stage-name { font-size: 10px; letter-spacing: 1px; color: var(--overlay0); }

/* Footer */
.footer {
  text-align: center; color: var(--overlay0); font-size: 10px;
  margin-top: 20px; padding-top: 12px; border-top: 1px solid var(--surface0);
}
</style>
</head>
<body>

<div class="breathing-bar"><div class="pulse" id="pulse"></div></div>
<div id="mode-badge" class="mode-badge mode-delta">DELTA</div>

<div class="grid">
  <!-- Left: Skills -->
  <div class="panel panel-left">
    <div class="panel-title">SKILL RADAR</div>
    <div id="skills"></div>
  </div>

  <!-- Right Top: Metabolic -->
  <div class="panel panel-right-top">
    <div class="panel-title">METABOLIC PANEL</div>
    <div class="metric-row">
      <span class="metric-label">LOAD</span>
      <div class="metric-bar"><div class="metric-fill" id="load-bar"></div></div>
      <span class="metric-value" id="load-val">0%</span>
    </div>
    <div class="metric-row">
      <span class="metric-label">SCREEN</span>
      <div class="metric-bar"><div class="metric-fill" id="screen-bar"></div></div>
      <span class="metric-value" id="screen-val">0m</span>
    </div>
    <div class="metric-row">
      <span class="metric-label">ACTIVE</span>
      <div class="metric-bar"><div class="metric-fill" id="active-bar"></div></div>
      <span class="metric-value" id="active-val">0%</span>
    </div>
    <div class="shield">
      <span class="shield-icon" id="shield-icon">&#x1F6E1;</span>
      <span class="shield-level shield-normal" id="shield-text">NORMAL</span>
    <a href="http://localhost:3100" target="_blank" style="color: var(--teal); text-decoration: none; font-size: 11px; letter-spacing: 1px;">PAPERCLIP →</a>
    <a href="http://localhost:3200" target="_blank" style="margin-left: 12px; color: var(--peach); text-decoration: none; font-size: 11px; letter-spacing: 1px;">OFFICE →</a>
    <span style="margin-left: auto;"></span>
    </div>
  </div>

  <!-- Right Bottom: Activity Feed -->
  <div class="panel panel-right-bottom">
    <div class="panel-title">ACTIVITY FEED</div>
    <div id="feed"></div>
    <div style="margin-top: 12px;">
      <div class="panel-title">DREAM REPORTS</div>
      <div id="dreams"></div>
    </div>
  </div>

  <!-- AGI Brain -->
  <div class="panel panel-full">
    <div class="panel-title">AGI BRAIN — SENSE → THINK → ACT</div>

    <!-- Pipeline -->
    <div style="display: flex; justify-content: space-around; align-items: center; margin-bottom: 16px; padding: 12px 0;">
      <div class="agi-stage" id="stage-sensing">
        <div class="stage-icon">👁️</div>
        <div class="stage-name">SENSE</div>
      </div>
      <div style="color: var(--surface1); font-size: 20px;">→</div>
      <div class="agi-stage" id="stage-thinking">
        <div class="stage-icon">🧠</div>
        <div class="stage-name">THINK</div>
      </div>
      <div style="color: var(--surface1); font-size: 20px;">→</div>
      <div class="agi-stage" id="stage-acting">
        <div class="stage-icon">⚡</div>
        <div class="stage-name">ACT</div>
      </div>
    </div>

    <!-- Stats -->
    <div style="display: flex; gap: 20px; margin-bottom: 12px; padding: 8px 0; border-top: 1px solid var(--surface0);">
      <div style="flex: 1;">
        <div style="color: var(--subtext); font-size: 11px; margin-bottom: 4px;">STATUS</div>
        <div id="agi-status" style="color: var(--green); font-weight: 700;">OFFLINE</div>
      </div>
      <div style="flex: 1;">
        <div style="color: var(--subtext); font-size: 11px; margin-bottom: 4px;">CYCLES</div>
        <div id="agi-cycles" style="color: var(--blue);">—</div>
      </div>
      <div style="flex: 1;">
        <div style="color: var(--subtext); font-size: 11px; margin-bottom: 4px;">ACTIONS</div>
        <div id="agi-actions" style="color: var(--purple);">—</div>
      </div>
      <div style="flex: 1;">
        <div style="color: var(--subtext); font-size: 11px; margin-bottom: 4px;">ERRORS</div>
        <div id="agi-errors" style="color: var(--red);">—</div>
      </div>
    </div>

    <div class="panel-title" style="margin-top: 12px;">感知信号强度</div>
    <div id="perception-bars" style="margin-bottom: 12px;"></div>

    <div class="panel-title" style="margin-top: 12px;">最近感知</div>
    <div id="agi-perceptions" style="color: var(--overlay0); font-size: 12px;"></div>
  </div>

  <!-- Subconscious status -->
  <div class="panel panel-full">
    <div class="panel-title">SUBCONSCIOUS</div>
    <div id="subconscious" style="color: var(--overlay0); font-size: 12px;">—</div>
  </div>
</div>

<div class="footer">
  Chronos-Zenith · Catppuccin Mocha · <span id="refresh-ts">—</span>
</div>

<script>
const REFRESH_MS = 2000;
const MAX_SKILL_XP = 200;  // reference max lines

function loadGradient(pct) {
  if (pct < 30) return 'var(--green)';
  if (pct < 70) return 'var(--yellow)';
  return 'var(--red)';
}

function updateBreathing(load) {
  const el = document.getElementById('pulse');
  el.style.animation = 'none';
  el.offsetHeight; // reflow
  let anim, dur;
  if (load < 30) { anim = 'breathe-delta'; dur = '4s'; }
  else if (load < 70) { anim = 'breathe-alpha'; dur = '2s'; }
  else { anim = 'breathe-intense'; dur = '0.8s'; }
  el.style.animation = `${anim} ${dur} linear infinite`;
}

function updateMode(load) {
  const el = document.getElementById('mode-badge');
  el.className = 'mode-badge';
  if (load < 30) { el.textContent = 'DELTA'; el.classList.add('mode-delta'); }
  else if (load < 70) { el.textContent = 'ALPHA'; el.classList.add('mode-alpha'); }
  else { el.textContent = 'INTENSE'; el.classList.add('mode-intense'); }
}

function updateShield(level) {
  const icon = document.getElementById('shield-icon');
  const text = document.getElementById('shield-text');
  text.className = 'shield-level';
  const map = {
    normal: { icon: '\u{1F6E1}', cls: 'shield-normal', label: 'NORMAL' },
    caution: { icon: '\u{26A0}', cls: 'shield-caution', label: 'CAUTION' },
    warning: { icon: '\u{26A0}', cls: 'shield-warning', label: 'WARNING' },
    critical: { icon: '\u{1F6D1}', cls: 'shield-critical', label: 'CRITICAL' },
  };
  const m = map[level] || map.normal;
  icon.textContent = m.icon;
  text.textContent = m.label;
  text.classList.add(m.cls);
}

function setBar(id, pct, max) {
  const bar = document.getElementById(id + '-bar');
  const val = document.getElementById(id + '-val');
  const p = Math.min(100, (pct / (max || 100)) * 100);
  bar.style.width = p + '%';
  if (id === 'load') bar.style.background = loadGradient(p);
  else if (id === 'active') bar.style.background = 'var(--teal)';
  else bar.style.background = 'var(--purple)';
}

function renderSkills(stats) {
  const el = document.getElementById('skills');
  el.innerHTML = '';
  const entries = Object.entries(stats).sort((a, b) => b[1] - a[1]);
  for (const [name, lines] of entries) {
    const pct = Math.min(100, (lines / MAX_SKILL_XP) * 100);
    el.innerHTML += `<div class="skill-row">
      <span class="skill-name" title="${name}">${name.replace('.md','')}</span>
      <div class="skill-bar"><div class="skill-fill" style="width:${pct}%"></div></div>
      <span class="skill-xp">${lines}xp</span>
    </div>`;
  }
}

function renderFeed(lessons) {
  const el = document.getElementById('feed');
  el.innerHTML = '';
  for (const line of lessons) {
    let tag = 'INFO', cls = 'tag-info';
    if (line.includes('成功') || line.includes('OK')) { tag = 'WIN'; cls = 'tag-success'; }
    else if (line.includes('修复') || line.includes('fix') || line.includes('踩坑')) { tag = 'FIX'; cls = 'tag-fix'; }
    const short = line.length > 80 ? line.slice(0, 80) + '…' : line;
    el.innerHTML += `<div class="feed-item"><span class="tag ${cls}">${tag}</span>${short}</div>`;
  }
}

function renderDreams(reports) {
  const el = document.getElementById('dreams');
  el.innerHTML = '';
  if (!reports.length) { el.innerHTML = '<div class="dream-item">暂无报告</div>'; return; }
  for (const r of reports) {
    const ts = r.replace('dream-', '').replace('.md', '');
    el.innerHTML += `<div class="dream-item">◆ ${ts.replace(/(\d{4})(\d{2})(\d{2})-(\d{2})(\d{2})(\d{2})/, '$1-$2-$3 $4:$5')}</div>`;
  }
}

async function refresh() {
  try {
    const r = await fetch('/chronos-data');
    const d = await r.json();

    // Sensory
    const load = d.sensory?.load ?? 0;
    setBar('load', load, 100);
    document.getElementById('load-val').textContent = load + '%';
    updateBreathing(load);
    updateMode(load);

    // Biofeedback
    const bf = d.biofeedback || {};
    const screenMin = bf.screen_minutes ?? 0;
    setBar('screen', screenMin, 120);
    document.getElementById('screen-val').textContent = Math.round(screenMin) + 'm';
    const active = (bf.activity_rate ?? 0) * 100;
    setBar('active', active, 100);
    document.getElementById('active-val').textContent = Math.round(active) + '%';
    updateShield(bf.protection_level || 'normal');

    // Skills
    renderSkills(d.memory_stats || {});

    // Feed
    renderFeed(d.recent_lessons || []);
    renderDreams(d.dream_reports || []);

    // AGI Brain
    const agi = d.agi_brain || {};
    const agiStatus = document.getElementById('agi-status');
    const agiCycles = document.getElementById('agi-cycles');
    const agiActions = document.getElementById('agi-actions');
    const agiErrors = document.getElementById('agi-errors');

    // Update pipeline stage
    const stages = ['sensing', 'thinking', 'acting'];
    const currentPhase = agi.current_phase || 'idle';
    stages.forEach(stage => {
      const el = document.getElementById('stage-' + stage);
      if (stage === currentPhase) {
        el.classList.add('agi-stage-active');
      } else {
        el.classList.remove('agi-stage-active');
      }
    });

    if (agi.running) {
      agiStatus.textContent = 'ACTIVE';
      agiStatus.style.color = 'var(--green)';
      agiCycles.textContent = agi.cycles || 0;
      agiActions.textContent = agi.actions_executed || 0;
      agiErrors.textContent = agi.errors || 0;
      agiErrors.style.color = (agi.errors || 0) > 0 ? 'var(--red)' : 'var(--overlay0)';
    } else {
      agiStatus.textContent = 'OFFLINE';
      agiStatus.style.color = 'var(--overlay0)';
      agiCycles.textContent = '—';
      agiActions.textContent = '—';
      agiErrors.textContent = '—';
    }

    // Perception strength bars
    const strengthEl = document.getElementById('perception-bars');
    const strength = d.perception_strength || {};
    const sources = Object.keys(strength).sort((a, b) => strength[b] - strength[a]);
    const maxStrength = Math.max(...Object.values(strength), 1);
    if (sources.length > 0) {
      strengthEl.innerHTML = sources.map(src => {
        const pct = (strength[src] / maxStrength) * 100;
        const color = pct > 70 ? 'var(--green)' : pct > 40 ? 'var(--yellow)' : 'var(--overlay0)';
        return `<div class="metric-row">
          <span class="metric-label" style="width: 100px; text-align: left; font-size: 10px;">${src}</span>
          <div class="metric-bar"><div class="metric-fill" style="width:${pct}%; background:${color};"></div></div>
          <span class="metric-value" style="width: 40px;">${strength[src]}</span>
        </div>`;
      }).join('');
    } else {
      strengthEl.innerHTML = '<div style="color: var(--overlay0); font-size: 11px;">无数据</div>';
    }

    // AGI Perceptions
    const perceptionsEl = document.getElementById('agi-perceptions');
    const perceptions = d.agi_perceptions || [];
    if (perceptions.length > 0) {
      perceptionsEl.innerHTML = perceptions.slice(0, 5).map(p => {
        const severityColors = ['var(--overlay0)', 'var(--yellow)', 'var(--peach)', 'var(--red)'];
        const color = severityColors[p.severity] || 'var(--overlay0)';
        const time = p.time ? p.time.split(' ')[1].substring(0, 5) : '';
        return `<div style="margin-bottom: 6px;">
          <span style="color: ${color}; font-weight: 700;">[${p.source}]</span>
          <span style="color: var(--text);">${p.summary}</span>
          <span style="color: var(--overlay0); font-size: 10px; margin-left: 8px;">${time}</span>
        </div>`;
      }).join('');
    } else {
      perceptionsEl.textContent = '无感知数据';
    }

    // Subconscious
    const sc = d.subconscious || {};
    const scEl = document.getElementById('subconscious');
    scEl.textContent = sc.status === 'completed'
      ? `最近分析: ${(sc.details?.report_file || '').split('/').pop()}` + (sc.details?.precheck?.ok ? ' · Nix: OK' : ' · Nix: —')
      : sc.status === 'running' ? '正在分析中...' : '等待空闲触发';

    document.getElementById('refresh-ts').textContent = new Date().toLocaleTimeString();
  } catch (e) {
    console.error('Chronos fetch error:', e);
  }
}

refresh();
setInterval(refresh, REFRESH_MS);
</script>
</body>
</html>
