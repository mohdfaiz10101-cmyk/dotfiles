<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101317">
  <title>项目控制台</title>
  <style>
    :root{color-scheme:dark;--bg:#0c0f12;--surface:#13171b;--surface2:#191e23;--line:#303840;--text:#edf1f4;--muted:#9ba7b2;--green:#49b675;--amber:#dca844;--red:#e06666;--blue:#65a4d9;--focus:#f2c14e}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:0}button,input,select,textarea{font:inherit;letter-spacing:0}button,a,input,select,textarea{border-radius:6px}button,a.nav{min-height:36px;border:1px solid var(--line);background:var(--surface2);color:var(--text);padding:7px 10px;text-decoration:none}button{cursor:pointer}button:hover,a.nav:hover{border-color:#5c6975}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--focus);outline-offset:2px}.primary{background:#24547a;border-color:#477fa8}.success{background:#174b2c;border-color:#39885a}.danger{color:#ffb9b9}.icon{width:36px;padding:0;font-size:18px}.shell{max-width:1520px;margin:auto;padding:0 18px 60px}
    header{position:sticky;top:0;z-index:10;background:rgba(16,19,23,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}.topbar{max-width:1520px;margin:auto;min-height:58px;padding:9px 18px;display:flex;align-items:center;gap:8px}.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}.brand strong{font-size:17px}.brand span{color:var(--muted);font-size:12px}.navs{display:flex;gap:6px}.sync{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px;white-space:nowrap}
    .summary{display:grid;grid-template-columns:repeat(6,minmax(105px,1fr));border:1px solid var(--line);border-radius:8px;margin:18px 0;background:var(--surface)}.metric{padding:13px 15px;border-right:1px solid var(--line)}.metric:last-child{border-right:0}.metric b{display:block;font-size:22px;font-variant-numeric:tabular-nums}.metric span{color:var(--muted);font-size:12px}.metric.alert b{color:var(--red)}.metric.warn b{color:var(--amber)}
    .toolbar{display:grid;grid-template-columns:minmax(180px,1fr) 150px 150px 150px auto;gap:8px;margin-bottom:16px}.toolbar input,.toolbar select,.form-grid input,.form-grid select,.form-grid textarea{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:9px 10px;min-height:38px}.toolbar input::placeholder,textarea::placeholder{color:#77838e}
    .section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 0 10px}.section-head h2{font-size:15px;margin:0}.section-head span{color:var(--muted);font-size:12px}.projects{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}.project{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:13px}.project-head{display:flex;gap:10px;align-items:flex-start}.project-head h3{margin:0;font-size:15px}.project-head p{margin:3px 0 0;color:var(--muted);font-size:12px}.project-score{margin-left:auto;font-size:18px;font-weight:700}.progress{height:6px;background:#293038;border-radius:5px;overflow:hidden;margin:12px 0}.progress i{display:block;height:100%;background:var(--green)}.milestones{display:grid;gap:5px}.milestone{display:flex;align-items:center;gap:7px;padding:5px 0;border:0;background:transparent;text-align:left;min-height:30px;width:100%}.milestone:hover{color:#fff}.dot{width:9px;height:9px;border:1px solid #65717c;border-radius:50%;flex:none}.dot.done{background:var(--green);border-color:var(--green)}.dot.in_progress{background:var(--amber);border-color:var(--amber)}
    .board{display:grid;grid-template-columns:repeat(5,minmax(245px,1fr));gap:10px;overflow-x:auto;padding-bottom:10px;scrollbar-width:thin}.lane{min-height:280px;background:#0f1316;border-top:2px solid var(--line);padding:10px}.lane[data-lane="blocked"]{border-color:var(--red)}.lane[data-lane="review"]{border-color:var(--amber)}.lane[data-lane="done"]{border-color:var(--green)}.lane-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}.lane-head h3{font-size:13px;margin:0}.count{min-width:24px;text-align:center;border:1px solid var(--line);border-radius:99px;color:var(--muted)}.lane-list{display:grid;gap:8px}.task{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:11px;cursor:pointer}.task:hover{border-color:#596674}.task-top{display:flex;gap:8px;align-items:flex-start}.task h4{font-size:14px;margin:0;line-height:1.35}.priority{width:4px;align-self:stretch;border-radius:3px;background:var(--blue);flex:none}.priority.urgent{background:var(--red)}.priority.high{background:var(--amber)}.priority.low{background:#71808c}.task-meta,.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.chip{border:1px solid #3b4650;border-radius:99px;padding:2px 6px;color:#b9c3cb;font-size:11px}.chip.overdue,.chip.blocked{color:#ffaaaa;border-color:#874242}.chip.today,.chip.soon{color:#ffd584;border-color:#735c31}.task-progress{display:flex;align-items:center;gap:7px;margin-top:9px;color:var(--muted);font-size:11px}.task-progress .progress{margin:0;flex:1;height:4px}.empty{color:var(--muted);padding:20px 8px;text-align:center;border:1px dashed var(--line);border-radius:7px}
    dialog{width:min(720px,calc(100% - 24px));max-height:92vh;padding:0;border:1px solid #46515b;border-radius:8px;background:var(--surface);color:var(--text);box-shadow:0 18px 60px #0009}dialog::backdrop{background:#050709bb;backdrop-filter:blur(3px)}.dialog-head{position:sticky;top:0;z-index:1;display:flex;align-items:center;padding:14px 16px;background:var(--surface);border-bottom:1px solid var(--line)}.dialog-head h2{margin:0;font-size:16px}.dialog-head button{margin-left:auto}.dialog-body{padding:16px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.form-grid label{display:grid;gap:5px;color:#c7d0d7;font-size:12px}.form-grid .wide{grid-column:1/-1}.form-grid textarea{min-height:78px;resize:vertical}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;padding-top:15px}.error{color:#ffaaaa}.notice{position:fixed;right:16px;bottom:16px;z-index:30;max-width:360px;padding:11px 14px;border:1px solid var(--line);border-radius:7px;background:#20262c;box-shadow:0 8px 28px #0008;display:none}.notice.show{display:block}.notice.bad{border-color:#944d4d;color:#ffc0c0}
    @media(max-width:900px){.summary{grid-template-columns:repeat(3,1fr)}.metric:nth-child(3){border-right:0}.metric:nth-child(-n+3){border-bottom:1px solid var(--line)}.toolbar{grid-template-columns:1fr 1fr}.toolbar input{grid-column:1/-1}.board{grid-template-columns:repeat(5,280px)}}
    @media(max-width:620px){.shell{padding:0 10px 50px}.topbar{padding:8px 10px;flex-wrap:wrap}.brand{width:100%}.navs{overflow-x:auto;max-width:calc(100vw - 68px)}.summary{grid-template-columns:repeat(2,1fr);margin-top:12px}.metric:nth-child(n){border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.metric:nth-child(2n){border-right:0}.metric:nth-last-child(-n+2){border-bottom:0}.toolbar{grid-template-columns:1fr 1fr}.projects{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.form-grid .wide{grid-column:auto}.board{grid-template-columns:repeat(5,86vw)}}
  </style>
</head>
<body>
<header><div class="topbar">
  <div class="brand"><strong>项目控制台</strong><span id="scope">全局执行视图</span></div>
  <div class="navs"><a class="nav" href="/workspace">工作区</a><a class="nav" href="/go/plane" target="_blank" rel="noopener">Plane</a><a class="nav" href="/go/huly" target="_blank" rel="noopener">Huly</a></div>
  <span class="sync" id="sync">未同步</span><button class="icon" id="refresh" title="刷新" aria-label="刷新">↻</button>
</div></header>
<main class="shell">
  <section class="summary" aria-label="项目指标">
    <div class="metric"><b id="m-projects">0</b><span>项目</span></div><div class="metric"><b id="m-active">0</b><span>活跃任务</span></div><div class="metric warn"><b id="m-review">0</b><span>待验收</span></div><div class="metric alert"><b id="m-blocked">0</b><span>阻塞</span></div><div class="metric alert"><b id="m-overdue">0</b><span>逾期</span></div><div class="metric"><b id="m-rate">0%</b><span>完成率</span></div>
  </section>
  <section class="toolbar" aria-label="任务筛选">
    <input id="search" type="search" placeholder="搜索项目、任务或标签">
    <select id="project-filter" aria-label="项目"><option value="">全部项目</option></select>
    <select id="priority-filter" aria-label="优先级"><option value="">全部优先级</option><option value="urgent">紧急</option><option value="high">高</option><option value="medium">中</option><option value="low">低</option></select>
    <select id="focus-filter" aria-label="聚焦"><option value="">全部任务</option><option value="overdue">仅逾期</option><option value="blocked">仅阻塞</option><option value="mine">进行中</option></select>
    <button class="primary" id="new-task">+ 新建任务</button>
  </section>
  <div class="section-head"><h2>项目进展</h2><span id="project-count"></span></div><section class="projects" id="projects"></section>
  <div class="section-head"><h2>执行看板</h2><span id="task-count"></span></div><section class="board" id="board"></section>
</main>

<dialog id="task-dialog"><form id="task-form">
  <div class="dialog-head"><h2 id="dialog-title">新建任务</h2><button class="icon" type="button" data-close title="关闭" aria-label="关闭">×</button></div>
  <div class="dialog-body"><input type="hidden" id="task-id"><div class="form-grid">
    <label>项目<select id="f-project" required></select></label><label>优先级<select id="f-priority"><option value="urgent">紧急</option><option value="high">高</option><option value="medium" selected>中</option><option value="low">低</option></select></label>
    <label class="wide">标题<input id="f-title" maxlength="160" required></label>
    <label>执行器<select id="f-assignee"><option value="auto">Auto</option><option value="op">OP</option><option value="crush">Crush</option></select></label><label>状态<select id="f-status"><option value="pending_approval">待审批</option><option value="delegated">已派发</option><option value="in_progress">进行中</option><option value="blocked">阻塞</option><option value="review">待验收</option><option value="done">已完成</option><option value="cancelled">已取消</option></select></label>
    <label>截止日期<input id="f-due" type="date"></label><label>预计分钟<input id="f-estimate" type="number" min="0" max="100000" inputmode="numeric"></label>
    <label>进度<input id="f-progress" type="number" min="0" max="100" inputmode="numeric"></label><label>标签<input id="f-tags" placeholder="frontend, urgent"></label>
    <label class="wide">目标<textarea id="f-goal"></textarea></label><label class="wide">任务说明<textarea id="f-brief"></textarea></label><label class="wide">完成定义<textarea id="f-acceptance" placeholder="可验证的验收条件"></textarea></label>
    <label class="wide">阻塞原因<textarea id="f-blocker"></textarea></label><label class="wide">验收证据<textarea id="f-evidence" placeholder="测试结果、链接、文件或可复测步骤"></textarea></label>
    <label class="wide">依赖任务<input id="f-dependencies" placeholder="任务 ID，以逗号分隔"></label>
  </div><div class="dialog-actions"><button type="button" data-close>取消</button><button type="button" class="success" id="approve-task" hidden>批准并派发</button><button type="submit" class="primary">保存</button></div></div>
</form></dialog>
<div class="notice" id="notice" role="status"></div>
<script>
const STATUS={pending_approval:'待审批',queued:'队列中',delegated:'已派发',in_progress:'进行中',blocked:'阻塞',review:'待验收',done:'已完成',cancelled:'已取消',dispatch_failed:'派发失败'};
const LANES=[['backlog','待处理'],['active','执行中'],['blocked','阻塞'],['review','验收'],['done','已完成']];
const PRIORITY={urgent:'紧急',high:'高',medium:'中',low:'低'};
let state={projects:[],tasks:[],summary:{}};let controller;const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function notice(message,bad=false){const el=$('notice');el.textContent=message;el.className='notice show'+(bad?' bad':'');clearTimeout(notice.timer);notice.timer=setTimeout(()=>el.className='notice',3500)}
function laneOf(status){if(['pending_approval','queued','dispatch_failed'].includes(status))return'backlog';if(['delegated','in_progress'].includes(status))return'active';if(status==='blocked')return'blocked';if(status==='review')return'review';return'done'}
function dueLabel(t){return t.due_state==='overdue'?'逾期 '+t.due_date:t.due_state==='today'?'今天截止':t.due_state==='soon'?'临近 '+t.due_date:(t.due_date||'')}
function renderSummary(){const s=state.summary||{};for(const [id,key] of [['m-projects','projects'],['m-active','active'],['m-review','review'],['m-blocked','blocked'],['m-overdue','overdue']])$(id).textContent=s[key]||0;$('m-rate').textContent=(s.completion_rate||0)+'%'}
function renderProjects(){const query=$('search').value.trim().toLowerCase();const list=(state.projects||[]).filter(p=>!query||[p.name,p.description,p.group].join(' ').toLowerCase().includes(query));$('project-count').textContent=list.length+' 个';$('projects').innerHTML=list.map(p=>`<article class="project"><div class="project-head"><div><h3>${esc(p.name)}</h3><p>${esc(p.description||'')}</p></div><span class="project-score">${esc(p.progress)}%</span></div><div class="progress"><i style="width:${Math.max(0,Math.min(100,p.progress||0))}%"></i></div><div class="milestones">${(p.milestones||[]).map(m=>`<button class="milestone" data-project="${esc(p.id)}" data-milestone="${esc(m.id)}" data-status="${esc(m.status)}"><i class="dot ${esc(m.status)}"></i><span>${esc(m.name)}</span></button>`).join('')||'<span class="empty">暂无里程碑</span>'}</div></article>`).join('')||'<div class="empty">没有匹配项目</div>'}
function filteredTasks(){const q=$('search').value.trim().toLowerCase(),project=$('project-filter').value,priority=$('priority-filter').value,focus=$('focus-filter').value;return(state.tasks||[]).filter(t=>{const hay=[t.title,t.project_name,t.brief,...(t.tags||[])].join(' ').toLowerCase();return(!q||hay.includes(q))&&(!project||t.project_id===project)&&(!priority||t.priority===priority)&&(!focus||(focus==='overdue'&&t.due_state==='overdue')||(focus==='blocked'&&(t.status==='blocked'||t.blocker))||(focus==='mine'&&['delegated','in_progress'].includes(t.status)))})}
function taskCard(t){const due=dueLabel(t),d=t.dispatch_state||{},agent=d.current_target||t.assignee||'auto',dispatchLabel=d.status?`派单 ${d.status}`:'';return`<article class="task" tabindex="0" data-task="${esc(t.id)}"><div class="task-top"><i class="priority ${esc(t.priority)}"></i><div><h4>${esc(t.title)}</h4><div class="task-meta"><span class="chip">${esc(t.project_name||t.project_id)}</span><span class="chip">${esc(PRIORITY[t.priority]||t.priority)}</span><span class="chip">${esc(agent)}</span>${dispatchLabel?`<span class="chip">${esc(dispatchLabel)}</span>`:''}${due?`<span class="chip ${esc(t.due_state)}">${esc(due)}</span>`:''}${t.blocker?'<span class="chip blocked">有阻塞</span>':''}</div></div></div><div class="chips">${(t.tags||[]).slice(0,4).map(tag=>`<span class="chip">#${esc(tag)}</span>`).join('')}</div><div class="task-progress"><div class="progress"><i style="width:${Math.max(0,Math.min(100,t.progress||0))}%"></i></div><span>${esc(t.progress||0)}%</span></div></article>`}
function renderBoard(){const tasks=filteredTasks();$('task-count').textContent=tasks.length+' 个任务';$('board').innerHTML=LANES.map(([id,label])=>{const items=tasks.filter(t=>laneOf(t.status)===id);return`<section class="lane" data-lane="${id}"><div class="lane-head"><h3>${label}</h3><span class="count">${items.length}</span></div><div class="lane-list">${items.map(taskCard).join('')||'<div class="empty">暂无</div>'}</div></section>`}).join('')}
function renderSelectors(){const options=(state.projects||[]).map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('');const current=$('project-filter').value;$('project-filter').innerHTML='<option value="">全部项目</option>'+options;$('project-filter').value=current;$('f-project').innerHTML=options}
function render(){renderSummary();renderSelectors();renderProjects();renderBoard()}
async function load(silent=false){if(controller)controller.abort();controller=new AbortController();if(!silent)$('sync').textContent='同步中';try{const r=await fetch('/api/projects/control',{cache:'no-store',signal:controller.signal});if(!r.ok)throw new Error('HTTP '+r.status);state=await r.json();render();$('sync').textContent='刚刚同步'}catch(e){if(e.name!=='AbortError'){notice('同步失败: '+e.message,true);$('sync').textContent='同步失败'}}}
function resetForm(){ $('task-form').reset();$('task-id').value='';$('f-progress').value=0;$('f-status').value='pending_approval';$('dialog-title').textContent='新建任务';$('approve-task').hidden=true;$('f-project').disabled=false }
function openNew(){resetForm();$('task-dialog').showModal()}
function openTask(id){const t=(state.tasks||[]).find(x=>x.id===id);if(!t)return;resetForm();$('task-id').value=t.id;$('dialog-title').textContent=t.title;$('f-project').value=t.project_id;$('f-project').disabled=true;$('f-title').value=t.title;$('f-priority').value=t.priority||'medium';$('f-assignee').value=t.assignee||'auto';$('f-status').value=t.status;$('f-due').value=t.due_date||'';$('f-estimate').value=t.estimate_minutes||0;$('f-progress').value=t.progress||0;$('f-tags').value=(t.tags||[]).join(', ');$('f-goal').value=t.goal||'';$('f-brief').value=t.brief||'';$('f-acceptance').value=t.acceptance||'';$('f-blocker').value=t.blocker||'';$('f-evidence').value=t.completion_evidence||'';$('f-dependencies').value=(t.dependencies||[]).join(', ');$('approve-task').hidden=!(t.status==='pending_approval'||t.status==='dispatch_failed'||t.approval==='pending');$('task-dialog').showModal()}
function formBody(){return{project_id:$('f-project').value,title:$('f-title').value.trim(),priority:$('f-priority').value,assignee:$('f-assignee').value,status:$('f-status').value,due_date:$('f-due').value,estimate_minutes:Number($('f-estimate').value||0),progress:Number($('f-progress').value||0),tags:$('f-tags').value,goal:$('f-goal').value,brief:$('f-brief').value,acceptance:$('f-acceptance').value,blocker:$('f-blocker').value,completion_evidence:$('f-evidence').value,dependencies:$('f-dependencies').value,window:'night'}}
async function saveTask(e){e.preventDefault();const id=$('task-id').value,body=formBody();const url=id?'/api/projects/tasks/'+encodeURIComponent(id)+'/update':'/api/projects/tasks';const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok){notice(d.error||'保存失败',true);return}$('task-dialog').close();notice(id?'任务已更新':'任务已加入待审批');await load(true)}
async function approve(){const id=$('task-id').value;if(!id)return;const r=await fetch('/api/projects/tasks/'+encodeURIComponent(id)+'/approve',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({target:$('f-assignee').value})});const d=await r.json();if(!r.ok){notice(d.error||'派发失败',true);return}$('task-dialog').close();notice('任务已批准并派发');await load(true)}
async function cycleMilestone(button){const next={pending:'in_progress',in_progress:'done',done:'pending'}[button.dataset.status]||'pending';const r=await fetch(`/api/projects/${encodeURIComponent(button.dataset.project)}/milestones/${encodeURIComponent(button.dataset.milestone)}`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({status:next})});const d=await r.json();if(!r.ok){notice(d.error||'里程碑更新失败',true);return}notice('里程碑已更新');await load(true)}
$('new-task').addEventListener('click',openNew);$('refresh').addEventListener('click',()=>load());$('task-form').addEventListener('submit',saveTask);$('approve-task').addEventListener('click',approve);document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>$('task-dialog').close()));$('task-dialog').addEventListener('click',e=>{if(e.target===$('task-dialog'))$('task-dialog').close()});
for(const id of ['search','project-filter','priority-filter','focus-filter'])$(id).addEventListener(id==='search'?'input':'change',()=>{renderProjects();renderBoard()});
$('projects').addEventListener('click',e=>{const b=e.target.closest('[data-milestone]');if(b)cycleMilestone(b)});$('board').addEventListener('click',e=>{const card=e.target.closest('[data-task]');if(card)openTask(card.dataset.task)});$('board').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-task]'))openTask(e.target.dataset.task)});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load(true)});setInterval(()=>{if(!document.hidden&&!$('task-dialog').open)load(true)},30000);load();
</script>
</body></html>
