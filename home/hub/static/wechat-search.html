<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>微信消息搜索</title>
    <style>
:root {
  --bg:#0f1720; --bg2:#111827; --card:#17212b; --line:#263445; --text:#e5eef8; --muted:#8da2b8;
  --green:#74d39a; --yellow:#f2c66d; --red:#f07f90; --blue:#7db7ff; --cyan:#6ed3de;
  --purple:#c4a7e7; --orange:#fab387;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  margin:0; color:var(--text); font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  background:radial-gradient(circle at top right, rgba(125,183,255,.18), transparent 26%),
    radial-gradient(circle at left center, rgba(110,211,222,.12), transparent 24%),
    linear-gradient(180deg, var(--bg), var(--bg2));
  min-height:100vh;
}
.container { max-width:800px; margin:0 auto; padding:20px; }
.main-nav { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
.nav-link { padding:8px 11px; border-radius:10px; border:1px solid var(--line); color:var(--muted); text-decoration:none; font-size:13px; background:rgba(255,255,255,.03); }
.nav-link:hover, .nav-link.active { color:var(--blue); border-color:var(--blue); background:rgba(125,183,255,.08); }
h1 { color:var(--blue); margin-bottom:20px; font-size:24px; }
.search-box { display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap; align-items:center; }
input, select { padding:10px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--text); flex:1; min-width:150px; outline:none; }
input:focus, select:focus { border-color:var(--blue); }
button { padding:10px 20px; background:var(--green); color:#0f1720; border:none; border-radius:8px; cursor:pointer; font-weight:600; transition:.15s; }
button:hover { filter:brightness(1.1); }
button:active { filter:brightness(.95); }
.messages { margin-top:20px; }
.message { padding:15px; border-bottom:1px solid var(--line); }
.message:last-child { border-bottom:none; }
.msg-header { display:flex; justify-content:space-between; color:var(--muted); font-size:12px; margin-bottom:5px; }
.msg-content { color:var(--text); line-height:1.6; word-break:break-all; }
.msg-talker { font-weight:600; color:var(--green); }
.loading { text-align:center; padding:20px; color:var(--muted); }
.error { color:var(--red); padding:10px; background:rgba(240,127,144,.1); border-radius:8px; margin-bottom:20px; }
.stats { color:var(--muted); font-size:12px; margin-bottom:10px; }
.load-more { text-align:center; margin-top:20px; }
@media (max-width: 560px) {
  .container { padding:12px; max-width:none; }
  .main-nav { overflow-x:auto; flex-wrap:nowrap; padding-bottom:2px; }
  .nav-link { white-space:nowrap; }
  h1 { font-size:21px; margin-bottom:14px; }
  .search-box { display:grid; grid-template-columns:1fr; gap:8px; margin-bottom:14px; }
  input, select, button { width:100%; min-width:0; font-size:16px; }
  button { padding:11px 14px; }
  label { margin-left:0 !important; justify-content:flex-start; padding:8px 0; }
  label input { width:auto; min-width:0; }
  .message { padding:12px 0; }
  .msg-header { flex-direction:column; gap:3px; align-items:flex-start; }
  .msg-content { font-size:14px; word-break:break-word; }
}
    </style>
</head>
<body>
    <div class="container">
        <nav class="main-nav">
            <a class="nav-link" href="/">🏠 总入口</a>
            <a class="nav-link" href="/dashboard">📊 服务全景</a>
            <a class="nav-link" href="/kanban">📋 任务看板</a>
            <a class="nav-link active" href="/wechat">💬 微信查询</a>
            <a class="nav-link" href="/search">🔍 全局搜索</a>
        </nav>
        <h1>微信消息搜索</h1>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="搜索消息内容..." />
            <input type="text" id="talkerInput" placeholder="联系人 ID (可选)" />
            <button onclick="loadMessages()">搜索</button>
            <label style="display: flex; align-items: center; margin-left: 10px;">
                <input type="checkbox" id="autoRefresh" checked onchange="toggleAutoRefresh()" style="width: auto; margin-right: 5px;">
                <span style="font-size: 14px; color: var(--muted);">自动刷新 (30s)</span>
            </label>
        </div>

        <div id="error" class="error"></div>
        <div id="stats" class="stats"></div>
        <div id="lastUpdate" class="stats"></div>

        <div id="loading" class="loading" style="display: none;">加载中...</div>
        <div id="messages" class="messages"></div>
        <div id="loadMore" class="load-more" style="display: none;">
            <button onclick="loadMore()">加载更多</button>
        </div>
    </div>

    <script>
        let currentOffset = 0;
        const LIMIT = 20;
        let autoRefreshInterval = null;
        let isLoading = false;
        const REFRESH_INTERVAL = 30000; // 30秒

        async function loadMessages(offset = 0, append = false) {
            if (isLoading && !append) return; // 防止重复加载

            const search = document.getElementById('searchInput').value;
            const talker = document.getElementById('talkerInput').value;
            const errorDiv = document.getElementById('error');
            const loadingDiv = document.getElementById('loading');
            const messagesDiv = document.getElementById('messages');
            const statsDiv = document.getElementById('stats');
            const lastUpdateDiv = document.getElementById('lastUpdate');
            const loadMoreDiv = document.getElementById('loadMore');

            errorDiv.style.display = 'none';
            if (!append) loadingDiv.style.display = 'block';

            if (!append) {
                messagesDiv.innerHTML = '';
                currentOffset = 0;
            }

            isLoading = true;

            try {
                const params = new URLSearchParams({
                    limit: LIMIT,
                    offset: offset,
                    search: search,
                    talker: talker
                });

                const response = await fetch(`/api/wechat/messages?${params}`);
                const data = await response.json();

                loadingDiv.style.display = 'none';

                if (data.error) {
                    throw new Error(data.error);
                }

                if (!append) {
                    statsDiv.textContent = `找到 ${data.length} 条消息`;
                    currentOffset = data.length;
                    // 更新最后刷新时间
                    const now = new Date();
                    lastUpdateDiv.textContent = `最后更新: ${now.toLocaleTimeString('zh-CN')}`;
                } else {
                    currentOffset += data.length;
                }

                data.forEach(msg => {
                    const div = document.createElement('div');
                    div.className = 'message';

                    const date = new Date(msg.time * 1000).toLocaleString('zh-CN');
                    const sender = msg.is_send ? '我' : msg.talker;

                    div.innerHTML = `
                        <div class="msg-header">
                            <span>${sender}</span>
                            <span>${date}</span>
                        </div>
                        <div class="msg-content">${escapeHtml(msg.content)}</div>
                    `;

                    messagesDiv.appendChild(div);
                });

                loadMoreDiv.style.display = data.length === LIMIT ? 'block' : 'none';
            } catch (err) {
                loadingDiv.style.display = 'none';
                errorDiv.textContent = `加载失败: ${err.message}`;
                errorDiv.style.display = 'block';
            } finally {
                isLoading = false;
            }
        }

        function loadMore() {
            loadMessages(currentOffset, true);
        }

        function toggleAutoRefresh() {
            const checkbox = document.getElementById('autoRefresh');
            if (checkbox.checked) {
                startAutoRefresh();
            } else {
                stopAutoRefresh();
            }
        }

        function startAutoRefresh() {
            stopAutoRefresh(); // 清除旧的
            autoRefreshInterval = setInterval(() => {
                if (!isLoading) {
                    loadMessages(0, false); // 重新加载全部（非追加）
                }
            }, REFRESH_INTERVAL);
        }

        function stopAutoRefresh() {
            if (autoRefreshInterval) {
                clearInterval(autoRefreshInterval);
                autoRefreshInterval = null;
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 初始加载
        loadMessages();
        // 启动自动刷新
        startAutoRefresh();

        // 页面离开时清理
        window.addEventListener('beforeunload', stopAutoRefresh);
    </script>
<script src="/static/hub-static.js?v=20260630-hubmenu3"></script>
</body>
</html>
