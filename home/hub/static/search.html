<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全局搜索</title>
<style>
:root {
  --bg:#0f1720; --bg2:#111827; --card:#17212b; --line:#263445; --text:#e5eef8; --muted:#8da2b8;
  --green:#74d39a; --yellow:#f2c66d; --red:#f07f90; --blue:#7db7ff; --cyan:#6ed3de;
  --purple:#c4a7e7; --orange:#fab387;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  margin:0; color:var(--text); font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  background:radial-gradient(circle at top right, rgba(125,183,255,.18), transparent 26%),
    radial-gradient(circle at left center, rgba(110,211,222,.12), transparent 24%),
    linear-gradient(180deg, var(--bg), var(--bg2));
  min-height:100vh;
}
.container { max-width:900px; margin:0 auto; padding:40px 20px; }
.main-nav { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
.nav-link { padding:8px 11px; border-radius:10px; border:1px solid var(--line); color:var(--muted); text-decoration:none; font-size:13px; background:rgba(255,255,255,.03); }
.nav-link:hover, .nav-link.active { color:var(--blue); border-color:var(--blue); background:rgba(125,183,255,.08); }
h1 { font-size:28px; margin-bottom:8px; color:var(--blue); }
.subtitle { color:var(--muted); font-size:13px; margin-bottom:24px; }
.search-box { display:flex; gap:10px; margin-bottom:20px; }
#q {
  flex:1; padding:14px 18px; font-size:16px; background:var(--card); border:1px solid var(--line);
  border-radius:8px; color:var(--text); outline:none; transition:border-color .2s;
}
#q:focus { border-color:var(--blue); }
button {
  padding:14px 28px; font-size:15px; background:var(--green); color:#0f1720; border:none;
  border-radius:8px; cursor:pointer; font-weight:600; transition:.15s;
}
button:hover { filter:brightness(1.1); }
button:disabled { background:var(--line); cursor:not-allowed; color:var(--muted); }
.status { font-size:12px; color:var(--muted); margin-bottom:16px; }
.section { margin-bottom:20px; }
.section-title {
  font-size:13px; font-weight:700; color:var(--blue); margin-bottom:8px;
  text-transform:uppercase; letter-spacing:.5px;
}
.item {
  padding:10px 14px; background:var(--card); border:1px solid var(--line); border-radius:8px;
  margin-bottom:6px; font-size:13px; word-break:break-all; line-height:1.5; cursor:pointer; transition:.15s;
}
.item:hover { border-color:var(--blue); background:rgba(125,183,255,.06); }
.item .icon { margin-right:8px; }
.item .path { color:var(--text); }
.item .snippet { color:var(--muted); font-size:12px; margin-top:3px; }
.item .snippet b { color:var(--orange); font-weight:600; }
.empty { color:var(--muted); font-size:13px; padding:20px; text-align:center; }
.error { color:var(--red); padding:12px; background:rgba(240,127,144,.1); border-radius:8px; margin-bottom:16px; }
.preview-panel { display:none; position:fixed; bottom:0; left:0; right:0; height:40vh; background:var(--card); border-top:1px solid var(--line); z-index:200; flex-direction:column; }
.preview-panel.open { display:flex; }
.preview-header { display:flex; justify-content:space-between; align-items:center; padding:8px 16px; background:var(--bg); border-bottom:1px solid var(--line); }
.preview-path { font-size:12px; color:var(--muted); font-family:monospace; }
.preview-close { background:none; border:none; color:var(--muted); font-size:18px; cursor:pointer; padding:0 8px; }
.preview-close:hover { color:var(--text); }
.preview-body { flex:1; overflow:auto; padding:16px; font-family:monospace; font-size:12px; white-space:pre-wrap; word-break:break-all; color:var(--text); }
@media (max-width:560px) {
  .container { padding:12px; max-width:none; }
  .main-nav { overflow-x:auto; flex-wrap:nowrap; padding-bottom:2px; }
  .nav-link { white-space:nowrap; }
  h1 { font-size:22px; }
  .subtitle { margin-bottom:14px; }
  .search-box { display:grid; grid-template-columns:1fr; gap:8px; }
  #q, button { width:100%; font-size:16px; }
  button { padding:12px 14px; }
  .preview-panel { height:58vh; }
}
</style>
</head>
<body>
<div class="container">
  <nav class="main-nav">
    <a class="nav-link" href="/">🏠 总入口</a>
    <a class="nav-link" href="/dashboard">📊 服务全景</a>
    <a class="nav-link" href="/kanban">📋 任务看板</a>
    <a class="nav-link" href="/wechat">💬 微信查询</a>
    <a class="nav-link active" href="/search">🔍 全局搜索</a>
  </nav>
  <h1>🔍 全局搜索</h1>
  <div class="subtitle">搜索 Linux 文件、Windows、手机 — 文件名 + 内容匹配</div>
  <div class="search-box">
    <input id="q" type="text" placeholder="输入关键词，如 wechat、config、log..." autofocus />
    <button id="btn" onclick="doSearch()">搜索</button>
  </div>
  <div id="status" class="status"></div>
  <div id="results"></div>
</div>
<div id="preview" class="preview-panel">
  <div class="preview-header">
    <span id="preview-path" class="preview-path"></span>
    <button class="preview-close" onclick="closePreview()">✕</button>
  </div>
  <div id="preview-body" class="preview-body"></div>
</div>
<script>
const qEl = document.getElementById('q');
const btn = document.getElementById('btn');
const statusEl = document.getElementById('status');
const resultsEl = document.getElementById('results');

qEl.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); doSearch(); } });

const urlQ = new URLSearchParams(location.search).get('q');
if (urlQ) { qEl.value = urlQ; setTimeout(doSearch, 300); }

async function doSearch() {
  const q = qEl.value.trim();
  if (!q) return;
  btn.disabled = true;
  resultsEl.innerHTML = '';
  statusEl.textContent = '搜索中...';
  try {
    const r = await fetch('/api/search?q=' + encodeURIComponent(q));
    const data = await r.json();
    if (!data.ok) { resultsEl.innerHTML = '<div class="error">' + esc(data.error) + '</div>'; return; }
    let html = '';
    html += renderSection('📄 文件名 (' + data.files.length + ')', data.files, i => '<div class="path">' + esc(i.path) + '</div>');
    html += renderSection('📝 内容匹配 (' + data.content.length + ')', data.content, i =>
      '<div class="path">' + esc(i.path) + '</div><div class="snippet">' + esc(i.snippet) + '</div>');
    html += renderSection('🪟 Windows (' + data.windows.length + ')', data.windows, i => '<div class="path">' + esc(i.path || i) + '</div>');
    html += renderSection('📱 手机 (' + data.phone.length + ')', data.phone, i => '<div class="path">' + esc(i.path || i) + '</div>');
    resultsEl.innerHTML = html || '<div class="empty">无结果</div>';
    statusEl.textContent = data.files.length + ' 文件 + ' + data.content.length + ' 内容 + ' + data.windows.length + ' Windows + ' + data.phone.length + ' 手机';
    resultsEl.querySelectorAll('.item').forEach(el => {
      el.addEventListener('click', () => openPath(el.dataset.path));
    });
  } catch(e) {
    resultsEl.innerHTML = '<div class="error">搜索失败: ' + esc(e.message) + '</div>';
  } finally {
    btn.disabled = false;
  }
}

function renderSection(title, items, render) {
  if (!items.length) return '';
  return '<div class="section"><div class="section-title">' + esc(title) + '</div>' + items.slice(0, 50).map(i =>
    '<div class="item" data-path="' + escAttr(i.path || '') + '"><span class="icon">•</span>' + render(i) + '</div>'
  ).join('') + '</div>';
}

async function openPath(p) {
  const ext = p.split('.').pop().toLowerCase();
  const textExts = ['txt','md','json','py','js','ts','sh','nix','conf','yaml','yml','log','csv','sql','html','css','xml','toml','ini','cfg'];
  if (!textExts.includes(ext)) { alert('仅支持文本文件预览'); return; }
  document.getElementById('preview-path').textContent = p;
  document.getElementById('preview-body').textContent = '加载中...';
  document.getElementById('preview').classList.add('open');
  try {
    const r = await fetch('/api/files/raw?path=' + encodeURIComponent(p));
    const d = await r.json();
    document.getElementById('preview-body').textContent = d.content || d.error || '(空)';
  } catch(e) {
    document.getElementById('preview-body').textContent = '加载失败: ' + e.message;
  }
}
function closePreview() { document.getElementById('preview').classList.remove('open'); }
function esc(s) { return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escAttr(s) { return esc(s).replace(/'/g, '&#39;'); }
</script>
<script src="/static/hub-static.js?v=20260630-hubmenu3"></script>
</body>
</html>
