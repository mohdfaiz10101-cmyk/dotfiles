<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hermes Monitor Panel</title>
<style>
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #e2e8f0; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 40px 24px; }
  h1 { font-size: 22px; margin-bottom: 8px; }
  p { color: #94a3b8; }
  a { color: #38bdf8; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 16px; margin-top: 16px; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Hermes Monitor Panel</h1>
    <p>监控面板运行在 <a href="http://127.0.0.1:19999" target="_blank">http://127.0.0.1:19999</a>，可直接在新标签页打开。</p>
    <div class="card">
      <p>如需常驻入口，可将该链接加入浏览器书签，或使用桌面快捷方式：</p>
      <ul>
        <li>应用名：Hermes Monitor Panel</li>
        <li>命令：<code>xdg-open http://127.0.0.1:19999</code></li>
        <li>服务：<code>hermes-monitor-panel.service</code></li>
      </ul>
    </div>
  </div>
</body>
</html>
