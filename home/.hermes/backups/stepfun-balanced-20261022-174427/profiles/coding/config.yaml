model:
  default: step-router-v1
  provider: stepfun-router
  context_length: 240000
  base_url: https://api.stepfun.com/step_plan/v1
providers:
  sub2api:
    name: Sub2API (Codex)
    base_url: http://127.0.0.1:19090/v1
    api_key: sk-e95...f874
    discover_models: true
  stepfun-router:
    api_key: change-me
    base_url: https://api.stepfun.com/step_plan/v1
    discover_models: true
    models:
      step-3.5-flash:
        context_length: 240000
      step-3.5-flash-2603:
        context_length: 240000
      step-3.7-flash:
        context_length: 240000
      step-5-preview:
        context_length: 1024000
      step-image-edit-2:
        context_length: 240000
      step-1o-vision-32k:
        context_length: 32000
      step-router-v1:
        context_length: 240000
      stepaudio-2.5-asr:
        context_length: 240000
      stepaudio-2.5-chat:
        context_length: 240000
      stepaudio-2.5-realtime:
        context_length: 240000
      stepaudio-2.5-tts:
        context_length: 240000
    default_model: step-router-v1
    api_mode: chat_completions
    model: step-3.7-flash
    name: StepFun Router
fallback_providers:
  - provider: stepfun-router
    model: step-3.7-flash
agent:
  max_turns: 90
  gateway_timeout: 1800
  api_max_retries: 5
sessions:
  auto_prune: true
  retention_days: 90
multiplex_profiles: true
mcp_servers:
  hermes-studio-api:
    command: /var/mnt/ai/home-offload/.nvm/versions/node/v23.11.1/bin/node
    args:
      - /var/mnt/ai/home-offload/.nvm/versions/node/v23.11.1/lib/node_modules/hermes-web-ui/bin/hermes-studio-mcp.mjs
      - api
    env:
      HERMES_WEB_UI_URL: http://127.0.0.1:8648
      HERMES_WEB_UI_HOME: /var/home/charlie/.hermes-web-ui-studio
      HERMES_WEBUI_STATE_DIR: /var/home/charlie/.hermes-web-ui-studio
      HERMES_WEB_UI_PROFILE: coding
      HERMES_MCP_SERVER_NAME: hermes-studio-api
      HERMES_MCP_TOOLSET: api
      HERMES_WEB_UI_MANAGED_MCP: "1"
    enabled: true
  hermes-studio-browser:
    command: /var/mnt/ai/home-offload/.nvm/versions/node/v23.11.1/bin/node
    args:
      - /var/mnt/ai/home-offload/.nvm/versions/node/v23.11.1/lib/node_modules/hermes-web-ui/bin/hermes-studio-mcp.mjs
      - browser
    env:
      HERMES_WEB_UI_URL: http://127.0.0.1:8648
      HERMES_WEB_UI_HOME: /var/home/charlie/.hermes-web-ui-studio
      HERMES_WEBUI_STATE_DIR: /var/home/charlie/.hermes-web-ui-studio
      HERMES_WEB_UI_PROFILE: coding
      HERMES_MCP_SERVER_NAME: hermes-studio-browser
      HERMES_MCP_TOOLSET: browser
      HERMES_WEB_UI_MANAGED_MCP: "1"
    enabled: true
  hermes-studio-devices:
    command: /var/mnt/ai/home-offload/.nvm/versions/node/v23.11.1/bin/node
    args:
      - /var/mnt/ai/home-offload/.nvm/versions/node/v23.11.1/lib/node_modules/hermes-web-ui/bin/hermes-studio-mcp.mjs
      - devices
    env:
      HERMES_WEB_UI_URL: http://127.0.0.1:8648
      HERMES_WEB_UI_HOME: /var/home/charlie/.hermes-web-ui-studio
      HERMES_WEBUI_STATE_DIR: /var/home/charlie/.hermes-web-ui-studio
      HERMES_WEB_UI_PROFILE: coding
      HERMES_MCP_SERVER_NAME: hermes-studio-devices
      HERMES_MCP_TOOLSET: devices
      HERMES_WEB_UI_MANAGED_MCP: "1"
    enabled: true
  hermes-studio-use:
    command: /var/mnt/ai/home-offload/.nvm/versions/node/v23.11.1/bin/node
    args:
      - /var/mnt/ai/home-offload/.nvm/versions/node/v23.11.1/lib/node_modules/hermes-web-ui/bin/hermes-studio-mcp.mjs
      - use
    timeout: 1860
    env:
      HERMES_WEB_UI_URL: http://127.0.0.1:8648
      HERMES_WEB_UI_HOME: /var/home/charlie/.hermes-web-ui-studio
      HERMES_WEBUI_STATE_DIR: /var/home/charlie/.hermes-web-ui-studio
      HERMES_WEB_UI_PROFILE: coding
      HERMES_MCP_SERVER_NAME: hermes-studio-use
      HERMES_MCP_TOOLSET: use
      HERMES_WEB_UI_MANAGED_MCP: "1"
    enabled: true
