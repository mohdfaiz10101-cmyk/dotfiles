<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Claude 输出监控</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #0d1117; --surface: #161b22; --border: #30363d;
  --text: #e6edf3; --dim: #7d8590; --accent: #58a6ff;
  --green: #3fb950; --red: #f85149; --yellow: #d29922;
}
body {
  font-family: "Noto Sans CJK SC", "SF Mono", Consolas, monospace;
  background: var(--bg); color: var(--text);
  padding: 0; overflow: hidden; height: 100vh;
  display: flex; flex-direction: column;
}
.header {
  background: var(--surface); padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  flex-shrink: 0;
}
.title {
  font-size: 16px; font-weight: 600;
  display: flex; align-items: center; gap: 8px;
}
.status {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--green); animation: pulse 2s infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}
.controls { display: flex; gap: 8px; }
.btn {
  padding: 8px 16px; border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--surface); color: var(--text);
  font-size: 13px; cursor: pointer;
  transition: all 0.15s; touch-action: manipulation;
}
.btn:active {
  background: var(--border); transform: scale(0.95);
}
.output-container {
  flex: 1; overflow-y: auto; padding: 16px;
  -webkit-overflow-scrolling: touch;
  font-size: 14px; line-height: 1.6;
}
.output-line {
  padding: 4px 0; white-space: pre-wrap;
  word-wrap: break-word; word-break: break-word;
}
.output-line.tool { color: var(--accent); }
.output-line.error { color: var(--red); }
.output-line.success { color: var(--green); }
.output-line.dim { color: var(--dim); }
.footer {
  background: var(--surface); padding: 8px 16px;
  border-top: 1px solid var(--border);
  font-size: 11px; color: var(--dim);
  text-align: center; flex-shrink: 0;
}
</style>
</head>
<body>

<div class="header">
  <div class="title">
    <div class="status" id="status"></div>
    <span>Claude 输出监控</span>
  </div>
  <div class="controls">
    <button class="btn" onclick="clearOutput()">清空</button>
    <button class="btn" onclick="toggleAutoScroll()">
      <span id="scrollBtn">自动滚动</span>
    </button>
  </div>
</div>

<div class="output-container" id="output">
  <div class="output-line dim">等待 Claude 输出...</div>
</div>

<div class="footer">
  <span id="lineCount">0 行</span> ·
  <span id="lastUpdate">未更新</span>
</div>

<script>
let autoScroll = true;
let lineCount = 0;
const output = document.getElementById('output');
const status = document.getElementById('status');

function addLine(text, type = '') {
  const line = document.createElement('div');
  line.className = 'output-line ' + type;
  line.textContent = text;
  output.appendChild(line);
  lineCount++;
  updateFooter();
  if (autoScroll) {
    output.scrollTop = output.scrollHeight;
  }
}

function clearOutput() {
  output.innerHTML = '<div class="output-line dim">已清空</div>';
  lineCount = 0;
  updateFooter();
}

function toggleAutoScroll() {
  autoScroll = !autoScroll;
  document.getElementById('scrollBtn').textContent =
    autoScroll ? '自动滚动' : '手动滚动';
}

function updateFooter() {
  document.getElementById('lineCount').textContent = lineCount + ' 行';
  document.getElementById('lastUpdate').textContent =
    new Date().toLocaleTimeString('zh-CN');
}

// 模拟实时输出（实际使用时连接到 WebSocket 或 SSE）
function simulateOutput() {
  const messages = [
    { text: '> 读取文件 /home/charlie/test.py', type: 'tool' },
    { text: '✓ 文件读取成功', type: 'success' },
    { text: '分析代码结构...', type: '' },
    { text: '发现 3 个函数定义', type: '' },
    { text: '> 执行 pytest tests/', type: 'tool' },
    { text: '✓ 所有测试通过', type: 'success' },
  ];

  let i = 0;
  setInterval(() => {
    if (i < messages.length) {
      addLine(messages[i].text, messages[i].type);
      i++;
    }
  }, 2000);
}

// 启动模拟（实际使用时替换为真实数据源）
setTimeout(simulateOutput, 1000);
</script>

</body>
</html>
