[Service]
# Avoid turning a slow stop into SIGABRT/core-dump. Core dumping the backend
# kills all MCP/codex children in the service cgroup and is the direct task-loss
# mechanism seen at 2026-07-05 01:56:04.
TimeoutStopFailureMode=terminate

# Keep stdout/stderr from becoming an unbounded I/O pressure source. The
# previous service disabled journald rate limiting, and the backend had written
# several GB through its pipes before the latest ABRT.
LogRateLimitIntervalSec=30s
LogRateLimitBurst=1000

# Do not spend I/O writing large core files when the backend aborts. The
# actionable signal is already in journal/service status; core dumps increase
# pressure during exactly the failure mode we are trying to avoid.
LimitCORE=0
