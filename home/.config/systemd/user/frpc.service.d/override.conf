[Service]
# frpc must talk to local frps (127.0.0.1:7000) directly.
# Even empty proxy vars break the handshake in some builds; unset them entirely.
Environment=http_proxy=
Environment=https_proxy=
Environment=HTTP_PROXY=
Environment=HTTPS_PROXY=
Environment=all_proxy=
Environment=ALL_PROXY=
Environment=no_proxy=127.0.0.1,localhost
Environment=NO_PROXY=127.0.0.1,localhost
UnsetEnvironment=http_proxy https_proxy HTTP_PROXY HTTPS_PROXY all_proxy ALL_PROXY
