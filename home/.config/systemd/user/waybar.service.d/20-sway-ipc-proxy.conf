[Service]
# Point waybar at the sway IPC proxy instead of the real sway socket.
#
# Why: TUI CLIs (codex/opencode/npm) animate a spinner by rewriting the window
# title ~10x/second. sway broadcasts window::title for each frame and waybar's
# sway/workspaces + sway/window modules both repaint on it, so the workspace row
# flickers. waybar cannot be told to ignore title events, and the spinner may
# already be running in a terminal that predates the pty-level filter
# (~/.local/bin/pty-title-filter.py).
#
# The proxy subscribes to real sway, drops window::title, and forwards
# everything else. waybar picks its socket from SWAYSOCK, so overriding the
# variable here is the whole change — no waybar config edit, no codex restart.
#
# The CLI keeps running and its session is untouched.
Environment=SWAYSOCK=/run/user/1000/sway-ipc-proxy.sock
