[Unit]
# waybar probes the xdg-desktop-portal color-scheme setting at startup to pick a
# light/dark CSS variant. portal is a DBus-activated service that starts well
# after the session target (observed: waybar 14:12:17, portal ready 14:13:32,
# 75 s later), so without this ordering waybar logs
#   GDBus.Error:org.freedesktop.DBus.Error.NameHasNoOwner:
#   Could not activate remote peer 'org.freedesktop.portal.Desktop'
# on every start and falls back to a default theme.
After=xdg-desktop-portal.service
Wants=xdg-desktop-portal.service

# xdg-desktop-portal itself is DBus-activated, so `After=` on it only helps
# once it is already running. Binding to the socket unit makes systemd pull it
# in as a dependency of this session instead of racing it.
After=xdg-desktop-portal.socket
Wants=xdg-desktop-portal.socket
