[Unit]
# graphical-session.target is inactive under a gdm-launched Wayland session
# (StopWhenUnneeded=yes, no job binds it), so WantedBy=graphical-session.target
# alone does not bring swaync up at login. Order after sway + the proxy that
# waybar uses, and pull them in explicitly instead of relying on the target.
After=sway.service sway-ipc-proxy.service
Wants=sway.service sway-ipc-proxy.service

[Service]
# NRestarts=8 accumulated while mako still owned
# org.freedesktop.Notifications and every start failed with
# "Could not acquire notification name". mako is now stopped/disabled, so the
# counter resets on this restart. Keep RestartSec small so a transient D-Bus
# hiccup is invisible.
RestartSec=2
