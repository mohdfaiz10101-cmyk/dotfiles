[Unit]
After=waybar.service
StartLimitIntervalSec=60
StartLimitBurst=4

[Service]
Environment=PATH=/var/home/charlie/.local/bin:/var/home/charlie/.nvm/versions/node/current/bin:/usr/local/bin:/usr/bin:/bin
Environment=QT_QPA_PLATFORM=wayland
Restart=on-failure
RestartSec=5
Nice=5
IOSchedulingClass=idle
