version: '3.8'

services:
  letta:
    image: letta/letta:latest
    container_name: letta
    restart: unless-stopped
    ports:
      - "8283:8283"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8283/v1/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    environment:
      - HOST=0.0.0.0
      - PORT=8283
      - LETTA_SERVER_PORT=8283
      - LETTA_API_KEY=letta
      - LETTA_PG_URI=postgresql://letta:letta@postgres:5432/letta
      - LETTA_LLM_BASE_URL=http://172.19.0.1:4000/v1
      - LETTA_LLM_MODEL=openai/glm-4.7
      - LETTA_LLM_API_KEY=sk-litellm-charlie-2026
      - LETTA_EMBEDDING_BASE_URL=http://172.19.0.1:8286/v1
      - LETTA_EMBEDDING_API_KEY=not-needed
      - LETTA_EMBEDDING_MODEL=all-MiniLM-L6-v2

      - OPENAI_API_BASE=http://172.19.0.1:4000/v1
      - OPENAI_API_KEY=sk-litellm-charlie-2026
      - NLTK_DATA=/root/nltk_data
      - HTTPS_PROXY=http://172.19.0.1:7890
      - HTTP_PROXY=http://172.19.0.1:7890
      - https_proxy=http://172.19.0.1:7890
      - http_proxy=http://172.19.0.1:7890
      - NO_PROXY=localhost,127.0.0.1,postgres,chromadb,172.19.0.1
      - no_proxy=localhost,127.0.0.1,postgres,chromadb,172.19.0.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - letta-data:/root/.letta
      - ./nltk_data:/root/nltk_data
    networks:
      - letta-net

  postgres:
    image: ankane/pgvector:latest
    container_name: letta-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=letta
      - POSTGRES_PASSWORD=letta
      - POSTGRES_DB=letta
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - letta-net
    command: postgres -c shared_preload_libraries=vector
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U letta -d letta"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  chromadb:
    image: chromadb/chroma:latest
    container_name: letta-chromadb
    restart: unless-stopped
    ports:
      # Host 8000 is already owned by the user-level chromadb.service.
      # Expose this compose instance on a non-conflicting localhost port.
      - "127.0.0.1:18000:8000"
    volumes:
      - chroma-data:/chroma/chroma
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - letta-net

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=charlie
      - N8N_BASIC_AUTH_PASSWORD=charlie2026n8n
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Asia/Shanghai
      - TZ=Asia/Shanghai
      - N8N_DIAGNOSTICS_ENABLED=false
      - HTTPS_PROXY=http://172.19.0.1:7890
      - HTTP_PROXY=http://172.19.0.1:7890
      - NO_PROXY=localhost,127.0.0.1,letta,postgres,chromadb,172.19.0.1
    volumes:
      - /mnt/ai/data/n8n:/home/node/.n8n
    networks:
      - letta-net

volumes:
  letta-data:
    driver: local
  postgres-data:
    driver: local
  chroma-data:
    driver: local

networks:
  letta-net:
    driver: bridge
